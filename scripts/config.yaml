# Configuration file for trinag model and hyperparameter settings
# of crop and weed dataset

#'0,1,2,3'
gpus_to_use: '0'
DPI: 300
LOG_WANDB:  False
sanity_check: False

project_name: 'FURROW_LINES2'
#'#'bean_aug_advent_carbonnier_new_data'
experiment_name: 'Exp_6_Reg'

log_directory: "/home/user01/data/furrow_line/logs/"
checkpoint_path: "/home/user01/data/furrow_line/chkpts/"
use_ocr: True

# Data loader parameters
# Fixed
data_dir: "/home/user01/data/furrow_line/dataset/"


# add sub dirs inside of train/val and test
sub_directories: ['img/', 'depth/', 'line/', 'seg/']
Normalize_data: True
Shuffle_data: True

# for data loader
pin_memory: True
num_workers: 6
num_classes: 2
img_height: 384
img_width: 768
# 4 means output of network is 4 times downsampled than input. 1 for Deeplab and PSP
output_stride: 2
label_smoothing: 0.0
batch_size: 2
WEIGHT_DECAY: 0.000095

# only for training data
Augment_data: True
# Augmentation Prbabilities
# shoudl be same legth
step_epoch:    [0]
#, 10, 15, 20, 25, 30]

geometric_aug: [0.3]
#, 0.1, 0.2, 0.4, 0.3, 0.3]
noise_aug:  [0.3]
#, 0.1, 0.2, 0.2, 0.2, 0.2]

# Regularization SD 0.5 LS 1e-2
drop_prob: 0.4
stochastic_drop_path: 3e-1
SD_mode: 'batch'
layer_scaling_val: 1e-5

# learning rate
learning_rate: 0.001
lr_schedule: 'cos'
epochs: 100
warmup_epochs: 2
# one of 'batch_norm' or 'sync_bn' or 'layer_norm'
norm_typ: 'sync_bn'
BN_MOM: 0.01
SyncBN_MOM: 3e-4

# MODEL
embed_dims: [96, 192, 384, 768]
